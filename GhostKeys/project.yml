name: GhostKeys
options:
  bundleIdPrefix: com.ghostkeys
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""     # Fill in with your Apple Developer team ID or leave blank for personal team
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GhostKeys:
    type: application
    platform: iOS
    sources:
      - path: GhostKeys
      - path: Shared
      - path: GhostKeys/Assets.xcassets
        optional: true
      - path: Resources/lexicon.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostkeys.host
        INFOPLIST_FILE: GhostKeys/Info.plist
        CODE_SIGN_ENTITLEMENTS: GhostKeys/GhostKeys.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: GhostKeyboard

  GhostKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: GhostKeyboard
      - path: Shared
      - path: Resources/lexicon.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostkeys.host.keyboard
        INFOPLIST_FILE: GhostKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: GhostKeyboard/GhostKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

schemes:
  GhostKeys:
    build:
      targets:
        GhostKeys: all
        GhostKeyboard: all
    run:
      config: Debug
      executable: GhostKeys
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
